<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.jpg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Technical Service Management System - Prime Line Coffee Service" />
    
    <!-- Open Graph / WhatsApp / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://primelinecoffee-service.netlify.app" />
    <meta property="og:title" content="Prime Line Coffee Service" />
    <meta property="og:description" content="Technical Service Management System - Prime Line Coffee Service" />
    <meta property="og:image" content="https://primelinecoffee-service.netlify.app/icon-512.jpg" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prime Line Coffee Service" />
    <meta name="twitter:description" content="Technical Service Management System - Prime Line Coffee Service" />
    <meta name="twitter:image" content="https://primelinecoffee-service.netlify.app/icon-512.jpg" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#003f7f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prime Line" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Prime Line Coffee Service</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker - Required for PWA installation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered:', registration);
              // Force update check
              registration.update();
            })
            .catch(error => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
